name: Update Template CI
# LOCAL EDIT (2026-10-17): the daily schedule is removed. This repo has no GH_PAT
# secret, and the default token cannot write .github/workflows, so every nightly
# run failed ("refusing to allow a GitHub App to create or update workflow
# `.github/workflows/graphs.yml` without `workflows` permission") and mailed a
# failure for nothing anyone can act on. Run it by hand if the template is ever
# wanted; it would also restore SECRETS_CONTEXT: toJson(secrets) below.
on:
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
