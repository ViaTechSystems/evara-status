# LOCAL EDIT (2026-10-17): `SECRETS_CONTEXT: ${{ toJson(secrets) }}` is removed.
# A workflow that serialises EVERY secret now ends `action_required` with no job
# run (GitHub's hardening; upstream upptime #312 renders named secrets instead).
# 188 of 188 Uptime CI runs 2026-10-15..17 ended that way, 902 failure mails in
# 7 days. .upptimerc.yml uses no secrets, and uptime-monitor's getSecret() falls
# back to process.env, so nothing is lost. Do not let update-template restore it.
name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.43.9
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
